name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Una corrida nueva sobre la misma rama cancela la anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      # Un fallo no cancela las demás: interesa ver todos los problemas de una vez.
      fail-fast: false
      matrix:
        check:
          - name: Tipos
            command: npm run typecheck
          - name: Lint
            command: npm run lint
          - name: Formato
            command: npm run format:check
          - name: Pruebas
            command: npm run test:coverage

    steps:
      - name: Obtener el código
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: ${{ matrix.check.name }}
        run: ${{ matrix.check.command }}

      - name: Publicar cobertura
        if: matrix.check.name == 'Pruebas'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  doctor:
    name: Expo doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Informa sobre dependencias incompatibles sin bloquear el merge.
      - run: npx expo-doctor
        continue-on-error: true
